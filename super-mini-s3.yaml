esphome:
  name: super-mini-s3
  comment: ESP32 dev board that powers a Cube Clock speaker
  friendly_name: SuperMini S3

esp32:
  variant: ESP32S3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key_super_mini_s3

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks: !secret wifi

debug:
  update_interval: 5min

sensor:
  - platform: internal_temperature
    name: "CPU temperature"
  - platform: wifi_signal
    name: "Signal strength"
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap memory free"

## Media source
sendspin:

media_source:
  - platform: sendspin
    # buffer_size: 50_000
    # sample_rate: 32_000
    id: sendspin_media_source

