# DEVICE=/dev/seeed-birch

## Boilerplate for Seeed boards

esphome:
  name: seeed-birch
  friendly_name: Seeed birch

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

## WiFi stuff

wifi:
  networks: !secret wifi

api:
  encryption:
    key: !secret api_key_seeed_birch

ota:
  - platform: esphome
    encryption:
      key: !secret api_key_seeed_birch

## Sensors

sensor:
  - platform: internal_temperature
    name: "CPU temperature"
  - platform: rotary_encoder
    name: "Knob"
    pin_a: 8
    pin_b: 9

binary_sensor:
  - platform: gpio
    pin:
      number: 10
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Knob button"
